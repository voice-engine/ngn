# ALSA fifo plugin sample configuration
#
# Original upstream sample:
# pcm.fifo {
#     type fifo
#     file "/tmp/ec.input"        # playback: pcm data is written here
#     infile "/tmp/ec.output"     # capture: pcm data is read from here
#     rate 16000
#     format S16_LE
# }
#
# NanoPi /home/i/ngn dual virtual cards (installed in /etc/asound.conf):
# mic-facing capture card (16k mono, engine writes mic/AEC data into the fifo)
pcm.voice_mic {
    type fifo
    infile "/tmp/voice_mic.fifo"
    rate 16000
    format S16_LE
    channels 1
}
# speaker-facing playback card (48k mono, engine reads reference data from the fifo)
pcm.voice_spk {
    type fifo
    file "/tmp/voice_spk.fifo"
    rate 48000
    format S16_LE
    channels 1
}
